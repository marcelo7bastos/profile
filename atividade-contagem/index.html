<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Descubra o nome e a quantidade</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(#edf8ff,#fff9ee);color:#17324d}.wrap{max-width:1100px;margin:auto;padding:28px 18px 64px}header{background:#fff3a6;border:4px solid #f2bd19;border-radius:28px;padding:22px;text-align:center;margin-bottom:22px}h1{margin:0;font-size:clamp(28px,4vw,52px);color:#163c9c}header p{font-size:clamp(16px,2vw,23px);font-weight:700}.exercise{background:#fff;border:3px solid #d9e7f2;border-radius:28px;padding:24px;margin:22px 0;box-shadow:0 10px 28px #0f172214}.exercise:nth-of-type(5n+1){border-color:#f0c419}.exercise:nth-of-type(5n+2){border-color:#e879c5}.exercise:nth-of-type(5n+3){border-color:#59a7e8}.exercise:nth-of-type(5n+4){border-color:#67c56d}.exercise:nth-of-type(5n+5){border-color:#f39a4a}.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.num{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#fde047;border:3px solid #f5b800;font-size:28px;font-weight:900}.prompt{font-size:clamp(18px,2.1vw,24px);font-weight:800}.objects{display:grid;gap:12px;align-items:center;margin:8px auto 22px;padding:18px;border-radius:22px;background:#f8fbff}.obj{display:grid;place-items:center;font-size:clamp(34px,5vw,58px);line-height:1}.answer{display:grid;grid-template-columns:1fr 220px;gap:14px}label{display:flex;flex-direction:column;gap:7px;font-weight:800;font-size:17px}input{width:100%;border:2px solid #aac2d6;border-radius:14px;padding:14px;font-size:20px}.feedback{min-height:28px;margin-top:14px;font-weight:900}.ok{color:#18794e}.err{color:#b42318}.actions{position:sticky;bottom:12px;display:flex;justify-content:center;gap:12px;margin-top:28px}button{border:0;border-radius:18px;padding:15px 24px;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px #0f172226}#check{background:#2563eb;color:#fff}#reset{background:#fff;color:#17324d;border:2px solid #bfd3e3}.score{text-align:center;font-size:20px;font-weight:900;margin-top:18px}@media(max-width:700px){.answer{grid-template-columns:1fr}.exercise{padding:18px 15px}.objects{gap:8px;padding:14px}.obj{font-size:40px}button{font-size:16px;padding:13px 18px}}
</style>
</head>
<body>
<main class="wrap">
<header><h1>ATIVIDADE: DESCUBRA O NOME E A QUANTIDADE</h1><p>Observe cada grupo. Escreva o nome da figura e quantas vezes ela aparece.</p></header>
<div id="exercises"></div>
<div class="actions"><button id="check">✓ Conferir respostas</button><button id="reset">↻ Limpar</button></div>
<div id="score" class="score"></div>
</main>
<script>
var data=[
{n:1,icon:"⚽",name:"bola",count:12,cols:4},
{n:2,icon:"⭐",name:"estrela",count:18,cols:6},
{n:3,icon:"🚗",name:"carro",count:14,cols:7},
{n:4,icon:"🌸",name:"flor",count:20,cols:5},
{n:5,icon:"🍎",name:"maçã",count:16,cols:4},
{n:6,icon:"🐟",name:"peixe",count:22,cols:11},
{n:7,icon:"❤️",name:"coração",count:15,cols:5},
{n:8,icon:"✏️",name:"lápis",count:24,cols:6},
{n:9,icon:"🍦",name:"sorvete",count:12,cols:4},
{n:10,icon:"🦋",name:"borboleta",count:20,cols:5}
];
var aliases={"bola":["bola","bolas"],"estrela":["estrela","estrelas"],"carro":["carro","carros"],"flor":["flor","flores"],"maçã":["maçã","maçãs","maca","macas"],"peixe":["peixe","peixes"],"coração":["coração","corações","coracao","coracoes"],"lápis":["lápis","lapis"],"sorvete":["sorvete","sorvetes"],"borboleta":["borboleta","borboletas"]};
function norm(s){return s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function render(){
 var root=document.getElementById("exercises");
 data.forEach(function(item){
  var card=document.createElement("section");card.className="exercise";card.dataset.n=item.n;
  var objs="";for(var i=0;i<item.count;i++){objs+='<span class="obj" aria-hidden="true">'+item.icon+'</span>'}
  card.innerHTML='<div class="top"><div class="num">'+item.n+'</div><div class="prompt">Qual é a figura? Quantas aparecem?</div></div>'+
  '<div class="objects" style="grid-template-columns:repeat('+item.cols+',minmax(28px,1fr))">'+objs+'</div>'+
  '<div class="answer"><label>Nome da figura<input class="name" placeholder="Digite o nome"></label><label>Quantidade<input class="count" inputmode="numeric" placeholder="Digite o número"></label></div><div class="feedback"></div>';
  root.appendChild(card);
 });
}
function checkAll(){
 var correct=0;
 document.querySelectorAll(".exercise").forEach(function(card){
  var item=data.find(function(x){return x.n===Number(card.dataset.n)});
  var ni=card.querySelector(".name"),ci=card.querySelector(".count"),fb=card.querySelector(".feedback");
  var accepted=aliases[item.name].map(norm),nameOK=accepted.indexOf(norm(ni.value))>=0,countOK=Number(ci.value)===item.count;
  ni.style.borderColor=nameOK?"#2e9b66":"#cf4b42";ci.style.borderColor=countOK?"#2e9b66":"#cf4b42";
  if(nameOK&&countOK){correct++;fb.className="feedback ok";fb.textContent="Muito bem! ✓"}
  else{fb.className="feedback err";fb.textContent=!nameOK&&!countOK?"Confira o nome e conte novamente.":!nameOK?"A quantidade está certa. Confira o nome.":"O nome está certo. Conte novamente."}
 });
 document.getElementById("score").textContent="Você acertou "+correct+" de "+data.length+" exercícios.";
}
function resetAll(){document.querySelectorAll("input").forEach(function(i){i.value="";i.style.borderColor=""});document.querySelectorAll(".feedback").forEach(function(f){f.textContent="";f.className="feedback"});document.getElementById("score").textContent="";window.scrollTo({top:0,behavior:"smooth"})}
render();document.getElementById("check").addEventListener("click",checkAll);document.getElementById("reset").addEventListener("click",resetAll);
</script>
</body>
</html>
